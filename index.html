<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Esercizio Tail Wind</title>
</head>
<body>
  <h1 class="text-3xl font-bold underline text-clifford text-center text-cyan-500 pe-0.5 bg-amber-100	mr-6">
    Hello world!
  </h1>
  <main class="container mx-auto p-4"> 
    <section class="mb-4"> 
      <h2 class="text-2xl font-semibold mb-2">Titolo Sezione</h2> 
      <p class="mb-4">Questo è un paragrafo di esempio. Puoi modificare questo testo con i tuoi contenuti.</p> 
      <button class="bg-green-500 text-white py-2 px-4 rounded transition duration-300 ease-in-out hover:bg-green-700">Clicca qui</button> 
    </section> 
    <section> 
      <h2 class="text-2xl font-semibold mb-2">Un'altra Sezione</h2> 
      <p class="mb-4">Questo è un altro paragrafo di esempio. Tailwind CSS rende facile aggiungere stili.</p> 
      <button class="bg-red-500 text-white py-2 px-4 rounded transition duration-300 ease-in-out hover:bg-red-700">Scopri di più</button> 
    </section> 
  </main>
  
</body>
</html>
